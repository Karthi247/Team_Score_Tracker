# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=team-score-tracker

# MySQL datasource
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:scoretracker_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Shared JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# JWT Security Configuration
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.scoretracker=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

